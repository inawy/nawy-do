name: android-emulator

# Builds the debug APK, installs it in a real Android emulator and checks that a task's reminder is
# rung by the PHONE with the app in the background (ADR 0045). By hand only: slow, and it can fail
# for emulator reasons, so it never blocks a merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm exec vite build
      - name: Generate the Android project
        run: pnpm exec cap add android
      - name: Icons
        run: |
          pip install --quiet pillow
          python3 tools/android/make_icons.py android/app/src/main/res
      - name: Reminder permissions
        run: python3 tools/android/patch_manifest.py android/app/src/main/AndroidManifest.xml
      - name: Copy the web app into it
        run: pnpm exec cap sync android
      - name: Use the fixed debug key so each build updates the last one
        run: mkdir -p ~/.android && cp tools/android/debug.keystore ~/.android/debug.keystore
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/android/emulator_test.sh android/app/build/outputs/apk/debug/app-debug.apk emulator-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-out-${{ matrix.api }}
          path: emulator-out
