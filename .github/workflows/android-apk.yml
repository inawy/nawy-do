name: android-apk

# Wraps the production build with Capacitor and builds an installable debug APK (ADR 0045). Separate
# from `ci` on purpose: slower, and never blocks a merge. Runs by hand (Actions → android-apk → Run
# workflow) or on branches named `native-*`. The android/ project is generated here from
# capacitor.config.json each time and never committed. The APK is attached to the pre-release
# `android-debug` so it can be opened on a phone.
on:
  workflow_dispatch:
  push:
    branches: ['native-*', 'native/**']

permissions:
  contents: write # only to publish the pre-release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm exec vite build
      - name: Generate the Android project
        run: pnpm exec cap add android
      - name: Icons
        run: |
          pip install --quiet pillow
          python3 tools/android/make_icons.py android/app/src/main/res
      - name: Reminder permissions
        run: python3 tools/android/patch_manifest.py android/app/src/main/AndroidManifest.xml
      - name: Copy the web app into it
        run: pnpm exec cap sync android
      - name: Use the fixed debug key so each build updates the last one
        run: mkdir -p ~/.android && cp tools/android/debug.keystore ~/.android/debug.keystore
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nawy-do-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish it as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk nawy-do-debug.apk
          gh release delete android-debug --cleanup-tag --yes || true
          gh release create android-debug nawy-do-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nawy To Do debug APK" \
            --notes "A debug build for trying the app on a phone (ADR 0045), built from $GITHUB_SHA. Signed with a debug key: for testing only, not for the Play Store. Replaced by the next build."
      - name: Dry run of the Play bundle with a throwaway key
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/throwaway.p12
          KEYSTORE_PASSWORD: throwaway-pass
          KEY_ALIAS: throwaway
          VERSION_CODE: '1'
          VERSION_NAME: '0.0.0-dryrun'
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore "$KEYSTORE_PATH" -alias throwaway \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=Throwaway"
          python3 tools/android/patch_gradle.py android/app/build.gradle
          cd android && ./gradlew bundleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/
