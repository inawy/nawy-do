name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile yet: it could not be generated offline. Replace with `npm ci` once committed.
      - run: npm install --no-audit --no-fund
      - name: Type check (errors as annotations)
        run: |
          npx tsc --noEmit --pretty false | sed -E 's/^([^()]+)\(([0-9]+),([0-9]+)\): (.*)$/::error file=\1,line=\2,col=\3::\4/' ; test "${PIPESTATUS[0]}" -eq 0
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: End-to-end (production build in a real browser)
        run: npm run e2e
      - name: Upload e2e traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
