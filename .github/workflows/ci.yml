name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: write # only to publish screenshots to the `ci-screenshots` branch

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from `packageManager` in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Frozen: what is tested is what ships. If package.json changed without the lockfile, the
      # install resolves anyway, publishes the new lockfile to the `ci-lockfile` branch and FAILS
      # on purpose: commit that file (the dev sandbox cannot run pnpm; CI is the only resolver).
      - name: Install
        run: |
          if ! pnpm install --frozen-lockfile; then
            pnpm install --no-frozen-lockfile
            mkdir /tmp/lock && cp pnpm-lock.yaml /tmp/lock/
            pnpm list --depth 0 --json > /tmp/lock/resolved.json
            cd /tmp/lock
            git init -q -b ci-lockfile
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -qm "lockfile for ${GITHUB_SHA}"
            git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-lockfile
            echo "::error title=lockfile outdated::package.json changed without pnpm-lock.yaml. The regenerated lockfile is on the ci-lockfile branch."
            exit 1
          fi
      - name: Type check (errors as annotations)
        run: |
          pnpm exec tsc --noEmit --pretty false | sed -E 's/^([^()]+)\(([0-9]+),([0-9]+)\): (.*)$/::error file=\1,line=\2,col=\3::\4/' ; test "${PIPESTATUS[0]}" -eq 0
      - name: Type check with TypeScript 7 (trial, never fails the build)
        continue-on-error: true
        run: |
          # The native compiler runs next to TS 6 (which typescript-eslint still needs: TS 7 has no
          # programmatic API yet). Both are timed so the gain is on record.
          echo "TypeScript 6:"; ( time pnpm exec tsc --noEmit --pretty false ) 2>&1 | tail -4
          echo "TypeScript 7:"; ( time pnpm --package=typescript@7 dlx tsc --noEmit --pretty false ) 2>&1 | tail -40
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test:coverage
      - name: Build (the log tail becomes an annotation when it fails)
        run: |
          set +e
          pnpm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=build failed::$(tail -n 25 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$code"
      - name: Bundle budget (gzip size of what a first visit downloads)
        run: pnpm run budget
      - name: Install Playwright browser
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (production build in a real browser)
        run: pnpm run e2e
      - name: Upload e2e traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push' && github.ref_name != 'main'
        continue-on-error: true
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "screenshots of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
