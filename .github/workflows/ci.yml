name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: write # only to publish screenshots to the `ci-screenshots` branch

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile yet: it could not be generated offline. Replace with `npm ci` once committed.
      - run: npm install --no-audit --no-fund
      - name: Type check (errors as annotations)
        run: |
          npx tsc --noEmit --pretty false | sed -E 's/^([^()]+)\(([0-9]+),([0-9]+)\): (.*)$/::error file=\1,line=\2,col=\3::\4/' ; test "${PIPESTATUS[0]}" -eq 0
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: End-to-end (production build in a real browser)
        run: npm run e2e
      - name: Upload e2e traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push' && github.ref_name != 'main'
        continue-on-error: true
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "screenshots of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
