name: android-release

# Builds the signed Android App Bundle (.aab) to upload to Google Play (ADR 0045). Run by hand. It
# needs three repository secrets (Settings → Secrets and variables → Actions): ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS. The key itself never lives in the repository.
# See docs/ANDROID.md.
on:
  workflow_dispatch:

permissions:
  contents: write # to attach the bundle to a draft release

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/upload.p12
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      # Play needs a larger number with every upload; the run number only grows.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: '1.0.${{ github.run_number }}'
    steps:
      - uses: actions/checkout@v4
      # After checkout: checkout cleans the workspace and would delete the key.
      - name: The signing secrets must exist
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS as repository secrets (see docs/ANDROID.md)."
            exit 1
          fi
          echo "$B64" | base64 -d > "$KEYSTORE_PATH"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm exec vite build
      - name: Generate the Android project
        run: pnpm exec cap add android
      - name: Icons
        run: |
          pip install --quiet pillow
          python3 tools/android/make_icons.py android/app/src/main/res
      - name: Reminder permissions
        run: python3 tools/android/patch_manifest.py android/app/src/main/AndroidManifest.xml
      - name: Version and release signing
        run: python3 tools/android/patch_gradle.py android/app/build.gradle
      - name: Copy the web app into it
        run: pnpm exec cap sync android
      - name: Build the signed bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Show who signed it
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256" || true
      - name: Keep the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab "nawy-do-${VERSION_NAME}.aab"
          gh release create "aab-${VERSION_NAME}" "nawy-do-${VERSION_NAME}.aab" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Play bundle ${VERSION_NAME}" \
            --notes "Signed App Bundle for Google Play, built from $GITHUB_SHA. Upload it in Play Console."
